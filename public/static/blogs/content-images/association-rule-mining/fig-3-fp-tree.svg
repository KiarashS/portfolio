<svg viewBox="0 0 860 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FP-tree over the three most frequent grocery categories">
<style>
  .nm{font-family:"Saira Condensed",Arial Narrow,sans-serif;font-size:12.5px;font-weight:600;fill:#171A18}
  .ct{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600;fill:#171A18}
  .lb{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.13em;fill:#565E56}
  .rt{font-family:"IBM Plex Mono",monospace;font-size:12px;fill:#171A18}
  .bx{fill:#E6E8E4;stroke:#C3C8C0;stroke-width:1}
  .ed{stroke:#565E56;stroke-width:1.2;fill:none}
  .nl{stroke-width:1.7;stroke-dasharray:5 4;fill:none}
  .ov{stroke:#A3283C}
  .rb{stroke:#565E56}
</style>

<!-- header table -->
<text class="lb" x="8" y="24">HEADER TABLE</text>
<rect class="bx" x="8" y="34" width="228" height="34"/>
<rect x="8" y="34" width="5" height="34" fill="#1F5061"/>
<text class="nm" x="22" y="55">whole milk</text>
<text class="ct" x="220" y="56" text-anchor="end">2513</text>
<rect class="bx" x="8" y="72" width="228" height="34"/>
<rect x="8" y="72" width="5" height="34" fill="#A3283C"/>
<text class="nm" x="22" y="93">other vegetables</text>
<text class="ct" x="220" y="94" text-anchor="end">1903</text>
<rect class="bx" x="8" y="110" width="228" height="34"/>
<rect x="8" y="110" width="5" height="34" fill="#565E56"/>
<text class="nm" x="22" y="131">rolls/buns</text>
<text class="ct" x="220" y="132" text-anchor="end">1809</text>
<text class="lb" x="8" y="170">SORTED BY GLOBAL</text>
<text class="lb" x="8" y="184">FREQUENCY, DESC.</text>

<!-- tree edges -->
<path class="ed" d="M530,62 L340,124"/>
<path class="ed" d="M530,62 L568,124"/>
<path class="ed" d="M530,62 L778,124"/>
<path class="ed" d="M340,172 L250,238"/>
<path class="ed" d="M340,172 L400,238"/>
<path class="ed" d="M568,172 L568,238"/>
<path class="ed" d="M250,286 L250,352"/>

