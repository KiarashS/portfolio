<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#FFFFFF"/>

  <text x="30" y="34" font-size="17" font-weight="700" fill="#14303A">Agreement is not reliance</text>
  <text x="30" y="56" font-size="12.5" fill="#5F7A85">You cannot separate a team that reasoned well from a team that agreed with a model</text>
  <text x="30" y="74" font-size="12.5" fill="#5F7A85">which happened to be right, unless you manipulate whether the model is right.</text>

  <text x="0" y="0" font-size="12.5" font-weight="600" fill="#14303A" text-anchor="middle" transform="translate(58,258) rotate(-90)">The team&#8217;s response</text>
  <text x="322" y="106" font-size="12.5" font-weight="600" fill="#14303A" text-anchor="middle">The agent&#8217;s output</text>

  <text x="220" y="132" font-size="12" font-weight="600" fill="#0F7A85" text-anchor="middle">correct</text>
  <text x="428" y="132" font-size="12" font-weight="600" fill="#C2721F" text-anchor="middle">incorrect</text>
  <text x="106" y="192" font-size="12" font-weight="600" fill="#14303A" text-anchor="end">followed</text>
  <text x="106" y="322" font-size="12" font-weight="600" fill="#14303A" text-anchor="end">rejected</text>

  <rect x="120" y="146" width="202" height="110" rx="6" fill="#E8F3F1" stroke="#A9CBCF"/>
  <text x="221" y="192" font-size="13" font-weight="700" fill="#0F5257" text-anchor="middle">Appropriate</text>
  <text x="221" y="211" font-size="13" font-weight="700" fill="#0F5257" text-anchor="middle">reliance</text>

  <rect x="328" y="146" width="202" height="110" rx="6" fill="#FBE9DA" stroke="#EBD3B4"/>
  <text x="429" y="192" font-size="13" font-weight="700" fill="#9C5514" text-anchor="middle">Over-reliance</text>
  <text x="429" y="213" font-size="11" fill="#9C5514" text-anchor="middle">the failure everyone fears</text>

  <rect x="120" y="264" width="202" height="110" rx="6" fill="#FBE9DA" stroke="#EBD3B4"/>
  <text x="221" y="310" font-size="13" font-weight="700" fill="#9C5514" text-anchor="middle">Under-reliance</text>
  <text x="221" y="331" font-size="11" fill="#9C5514" text-anchor="middle">the failure nobody logs</text>

  <rect x="328" y="264" width="202" height="110" rx="6" fill="#E8F3F1" stroke="#A9CBCF"/>
  <text x="429" y="310" font-size="13" font-weight="700" fill="#0F5257" text-anchor="middle">Appropriate</text>
  <text x="429" y="329" font-size="13" font-weight="700" fill="#0F5257" text-anchor="middle">rejection</text>

  <text x="120" y="404" font-size="11" fill="#5F7A85">Collapse the two columns and all four cells become a single number:</text>
  <text x="120" y="422" font-size="11" fill="#5F7A85">agreement rate. It rises when the model improves and when the team</text>
  <text x="120" y="440" font-size="11" fill="#5F7A85">stops thinking.</text>

  <rect x="576" y="96" width="294" height="344" rx="8" fill="#14303A"/>
  <text x="598" y="124" font-size="13" font-weight="700" fill="#FFFFFF">What is missing at group scale</text>
  <rect x="598" y="138" width="250" height="1" fill="#2C555B"/>

  <text x="598" y="164" font-size="11" fill="#BFD9DA">Agreement rate, switch fraction and weight</text>
  <text x="598" y="181" font-size="11" fill="#BFD9DA">of advice all describe one person accepting</text>
  <text x="598" y="198" font-size="11" fill="#BFD9DA">or rejecting one suggestion.</text>

  <text x="598" y="228" font-size="11" fill="#7FD1C4">A group adds quantities none of them reach:</text>
  <text x="598" y="252" font-size="11" fill="#BFD9DA">&#183; who prompted, and who deferred</text>
  <text x="598" y="272" font-size="11" fill="#BFD9DA">&#183; whether a claim was examined or absorbed</text>
  <text x="598" y="292" font-size="11" fill="#BFD9DA">&#183; reversals of an initial group rejection</text>
  <text x="598" y="312" font-size="11" fill="#BFD9DA">&#183; influence never voiced as agreement</text>

  <text x="598" y="348" font-size="11" fill="#E08A3C" font-weight="600">Johnson and colleagues name this as future</text>
  <text x="598" y="365" font-size="11" fill="#E08A3C" font-weight="600">work: evaluation frameworks that measure</text>
  <text x="598" y="382" font-size="11" fill="#E08A3C" font-weight="600">influence within a social structure.</text>

  <text x="598" y="414" font-size="11" fill="#8FAAB0" font-style="italic">As of mid-2026 that instrument does not exist.</text>

  <text x="30" y="478" font-size="10.5" fill="#9BB6BC">The 2&#215;2 is the standard individual-level framing in the human&#8211;AI reliance literature.</text>
</svg>
